 <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Minhas Roupas Favoritas</title>
  <style>
    /* Estilos do corpo da página */
    body {
      background-color: #f3e5f5; /* Fundo roxo bem claro */
      color: #4a148c;            /* Texto roxo escuro */
      font-family: sans-serif;
      text-align: center;
      margin: 20px;
    }

    /* Título Principal */
    h1 {
      color: #d81b60; /* Rosa escuro */
    }

    /* Tamanho fixo para todas as fotos */
    img {
      width: 200px;
      height: 250px;
      border-radius: 15px;      /* Borda arredondada nas fotos */
      border: 3px solid #d81b60; /* Moldura rosa na foto */
    }

    /* Espaçamento entre os itens */
    .item {
      margin-bottom: 30px;
    }
  </style>
</head>
<body>

  <h1>Galeria de Roupas Rosa e Roxo</h1>
  <p>Algumas peças do meu estilo favorito:</p>

  <div class="item">
    <h2>Casaco Rosa</h2>
    <img src="https://images.unsplash.com/photo-1544441893-675973e31985?w=400" alt="Casaco Rosa">
  </div>

  <div class="item">
    <h2>Vestido Roxo</h2>
    <img src="https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?w=400" alt="Vestido Roxo">
  </div>

</body>
</html>
