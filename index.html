<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Minha Pesquisa de Roupas
    </title>
    Por: Ana lusa Pereira, 1B 
  <meta charset="UTF-8">
  <title>Minha Loja de Roupas</title>
  <style>
    /* Estilos da página */
    body {
      background-color: #ffe6f2; /* Fundo rosa bem clarinho */
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    /* Título principal */
    h1 {
      color: #800080; /* Roxo */
    }

    /* Subtítulos */
    h2 {
      color: #ff1493; /* Rosa choque */
    }

    /* Caixa do produto */
    .produto {
      background-color: white;
      border: 2px solid #800080; /* Borda roxa */
      border-radius: 10px;
      width: 200px;
      padding: 15px;
      margin: 10px auto; /* Centraliza a caixa na tela */
    }

    /* Botão */
    button {
      background-color: #ff1493;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #800080; /* Muda para roxo ao passar o mouse */
    }
  </style>
</head>
<body>

  <h1>Loja Rosa & Roxo</h1>
  <p>Bem-vindo à minha coleção!</p>

  <h2>Produtos em Destaque</h2>

  <div class="produto">
    <h3>👗 Vestido Roxo</h3>
    <p>Preço: R$ 50,00</p>
    <button>Comprar</button>
  </div>

  <div class="produto">
    <h3>👚 Camiseta Rosa</h3>
    <p>Preço: R$ 30,00</p>
    <button>Comprar</button>
  </div>

</body>
</html>
